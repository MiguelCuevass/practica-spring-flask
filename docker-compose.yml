services:
  mysqldb:
    image: mysql:8.0.31-oracle
    restart: unless-stopped
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=$MYSQLDB_ROOT_PASSWORD_DES
      - MYSQL_DATABASE=basicosd
    ports:
      - $MYSQLDB_LOCAL_PORT:3306
    volumes:
      - db:/var/lib/mysql
    networks:
      - app-network

  postgres-db:
    image: postgres:12
    restart: always
    env_file: ./.env
    environment:
      POSTGRES_DB: $POSTGRES_DATABASE_DES
      POSTGRES_USER: $POSTGRES_USER_DES
      POSTGRES_PASSWORD: $POSTGRES_ROOT_PASSWORD_DES
    ports:
      - $POSTGRES_LOCAL_PORT_DES:5432
    volumes:
      - postgresdata:/var/lib/postgresql/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

  python-api:
    build: ./python-api
    restart: on-failure
    ports:
      - "5000:5000"
    depends_on:
      - postgres-db
    networks:
      - app-network

  webapp:
    depends_on:
      - mysqldb
    build: ./
    restart: on-failure
    env_file: ./.env
    ports:
      - $SPRING_LOCAL_PORT_DES:8080
    environment:
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=$MYSQLDB_ROOT_PASSWORD_DES
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=false
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/basicosd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .m2:/root/.m2
      - type: bind
        source: ./certificates
        target: /certificates
    stdin_open: true
    tty: true

networks:
  app-network:
    driver: bridge

volumes:
  db:
  postgresdata: